services:
  - type: web
    name: luna-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000

      - key: MONGODB_URI
        sync: false

      - key: GMAIL_USER
        sync: false

      - key: GMAIL_PASS
        sync: false

      - key: IMAP_HOST
        sync: false

      - key: IMAP_PORT
        sync: false
